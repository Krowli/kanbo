name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # The package supports Node ^22.19.0 || >=24.11.0 (see "engines").
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # Installing from the lockfile, npm runs `node-gyp rebuild` for
      # better-sqlite3 (it misses its "gypfile": false), and Windows runners have
      # no C++ toolchain. No dependency needs its scripts: better-sqlite3 ships
      # prebuilt binaries. A user's `npm install -g kanbo-cli` is not affected.
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm run typecheck
      # One cell measures coverage while it runs the suite: a summary in the
      # log, the lcov report as an artifact, and the thresholds in
      # vitest.config.ts fail the job when coverage drops.
      - run: npm test
        if: ${{ !(matrix.os == 'ubuntu-latest' && matrix.node == 24) }}
      - run: npm run coverage
        if: ${{ matrix.os == 'ubuntu-latest' && matrix.node == 24 }}
      - uses: actions/upload-artifact@v7
        if: ${{ always() && matrix.os == 'ubuntu-latest' && matrix.node == 24 }}
        with:
          name: coverage-lcov
          path: coverage/lcov.info
          if-no-files-found: ignore
      # What users install: pack, `npm install -g` the tarball into a temporary
      # prefix, and drive the installed kanbo through a new project.
      - run: node scripts/smoke.mjs
      # An upgrade: the published kanbo-cli@0.2.1 sets up a project and fills
      # its board, then this build is installed over it (needs the registry).
      - run: node scripts/smoke.mjs --upgrade

  # Not required yet: arm64 runners and Alpine (musl). The results are
  # reported on every run, and a failure does not fail the workflow.
  test-extra:
    name: Node ${{ matrix.node }} on ${{ matrix.os }} (not required)
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04-arm, windows-11-arm]
        node: [24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm run typecheck
      - run: npm test
      - run: node scripts/smoke.mjs
      - run: node scripts/smoke.mjs --upgrade

  alpine:
    name: Node 22 on Alpine (not required)
    runs-on: ubuntu-latest
    continue-on-error: true
    container: node:22-alpine
    steps:
      # git for checkout, the tests and the smoke's `git init`.
      - run: apk add --no-cache git
      - uses: actions/checkout@v7
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm run typecheck
      - run: npm test
      - run: node scripts/smoke.mjs
      - run: node scripts/smoke.mjs --upgrade
