name: release

on:
  push:
    tags: ["v*"]
  # A published npm version can never be reused, even after an unpublish. A
  # manual run is always a dry run: the whole path short of `npm publish`,
  # rehearsable before a tag exists.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: the tag, package.json and the changelog agree
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - id: check
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          echo "package.json=$version"
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            tag="${GITHUB_REF_NAME#v}"
            echo "tag=$tag"
            test "$tag" = "$version" || { echo "::error::tag $tag != package.json $version"; exit 1; }
          fi
          grep -q "^## \[$version\]" CHANGELOG.md || { echo "::error::CHANGELOG.md has no [$version] section"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Extract the changelog section for this version
        run: |
          awk -v v="${{ steps.check.outputs.version }}" '
            index($0, "## [" v "]") == 1 {f=1; next}
            f && /^## \[/ {exit}
            f {print}
          ' CHANGELOG.md > RELEASE_BODY.md
          test -s RELEASE_BODY.md || { echo "::error::the changelog section is empty"; exit 1; }
          cat RELEASE_BODY.md

      - uses: actions/upload-artifact@v7
        with:
          name: release-body
          path: RELEASE_BODY.md

  # CI, the whole of it, on exactly the commit the tag names — every OS and
  # Node, the smoke and upgrade tests — as a reusable workflow rather than a
  # lookup of an earlier CI run: a run for this commit may still be going, may
  # have been cancelled by a newer push, or may not exist at all (a tag pushed
  # on a commit that never went through `main`). Nothing is built for
  # publishing unless its required jobs pass here; the jobs CI marks "not
  # required" (continue-on-error) do not hold a release back, as they do not
  # fail CI either.
  ci:
    name: CI on the tagged commit
    needs: verify
    uses: ./.github/workflows/ci.yml

  build:
    name: build, test and pack
    needs: [verify, ci]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - run: npm test

      # The tarball is what users install, and the very file the npm job
      # publishes. Look inside it before anything is published.
      - name: Pack and check the tarball
        run: |
          set -euo pipefail
          npm pack
          tarball=$(ls kanbo-cli-*.tgz)
          test "$tarball" = "kanbo-cli-${{ needs.verify.outputs.version }}.tgz" || { echo "::error::packed $tarball, expected kanbo-cli-${{ needs.verify.outputs.version }}.tgz"; exit 1; }
          tar -tzf "$tarball" > contents.txt
          for f in package/dist/cli.cjs package/dist/lib/index.mjs package/dist/lib/index.d.mts \
                   package/dist/drizzle-sqlite/meta/_journal.json package/dist/drizzle-postgres/meta/_journal.json \
                   package/CHANGELOG.md; do
            grep -qx "$f" contents.txt || { echo "::error::$tarball is missing $f"; exit 1; }
          done
          ! grep -q '\.map$' contents.txt || { echo "::error::$tarball ships source maps"; exit 1; }
          test "$(node -p "require('./package.json').bin.kanbo")" = "dist/cli.cjs"
          wc -l contents.txt
          ls -l "$tarball"

      # Install that very tarball globally into a temporary prefix and drive it
      # through a new project before anything is published.
      - name: Smoke-test the tarball
        run: node scripts/smoke.mjs --tarball "$(ls kanbo-cli-*.tgz)"

      - uses: actions/upload-artifact@v7
        with:
          name: tarball
          path: kanbo-cli-*.tgz

  npm:
    name: publish to npm
    needs: [verify, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write          # trusted publishing (OIDC) and provenance: no token anywhere
    steps:
      # Node 24: trusted publishing needs npm >= 11.5.1.
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      # The tarball the build job packed and smoke-tested, byte for byte — not
      # a rebuild. Publishing a tarball runs no lifecycle script, so nothing
      # here can change what was tested.
      - uses: actions/download-artifact@v8
        with:
          name: tarball
          path: .

      - name: Check the tarball's version
        run: |
          set -euo pipefail
          tarball="kanbo-cli-${{ needs.verify.outputs.version }}.tgz"
          test -f "$tarball" || { echo "::error::no $tarball among the build's artifacts"; ls -l; exit 1; }
          packed=$(tar -xOzf "$tarball" package/package.json | node -p "JSON.parse(require('fs').readFileSync(0, 'utf8')).version")
          test "$packed" = "${{ needs.verify.outputs.version }}" || { echo "::error::$tarball says version $packed"; exit 1; }

      - name: Publish
        if: ${{ github.event_name == 'push' }}
        run: |
          set -euo pipefail
          version="${{ needs.verify.outputs.version }}"
          if npm view "kanbo-cli@$version" version >/dev/null 2>&1; then
            echo "kanbo-cli@$version is already on the registry; nothing to do"
            exit 0
          fi
          npm publish "./kanbo-cli-$version.tgz" --provenance --access public
          # The registry answers before the version is readable; wait for it.
          for _ in $(seq 1 30); do
            npm view "kanbo-cli@$version" version >/dev/null 2>&1 && exit 0
            sleep 10
          done
          echo "::warning::published but not yet visible on the registry after five minutes"

      - name: Dry run
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: npm publish "./kanbo-cli-${{ needs.verify.outputs.version }}.tgz" --dry-run --access public

  github-release:
    name: publish the GitHub release
    needs: [verify, build, npm]
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-body
      - uses: actions/download-artifact@v8
        with:
          name: tarball
          path: .
      # Create or update, so a re-run after a partial failure still succeeds.
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --title "$GITHUB_REF_NAME" --notes-file RELEASE_BODY.md
            gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber kanbo-cli-*.tgz
          else
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --title "$GITHUB_REF_NAME" --notes-file RELEASE_BODY.md kanbo-cli-*.tgz
          fi
