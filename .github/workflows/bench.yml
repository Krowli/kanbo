name: Bench

# Timings on a board of 1,000 cards, run by hand or once a week — never on a
# push: numbers from a shared runner vary too much to gate anything on. The
# report is the job summary and an artifact. See docs/performance.md.
on:
  workflow_dispatch:
    inputs:
      sizes:
        description: Board sizes, comma-separated
        default: '1000'
  schedule:
    - cron: '0 5 * * 1'

permissions:
  contents: read

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm run bench -- --sizes "$SIZES" --payload-sizes "$SIZES" --out bench.md
        env:
          SIZES: ${{ inputs.sizes || '1000' }}
      - run: cat bench.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: bench
          path: bench.md
