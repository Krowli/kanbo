name: Feature request
description: Suggest a change or a new capability.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you or your agents trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you would like
      description: Commands, tools, flags or behavior you have in mind.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
  - type: dropdown
    id: surface
    attributes:
      label: Area
      multiple: true
      options:
        - CLI
        - MCP tools
        - HTTP API / board page
        - Storage (SQLite / Postgres)
        - Agent setup (kanbo init, instructions)
        - Documentation
